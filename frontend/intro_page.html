
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bike EMI Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Bike EMI Calculator</h1>

        <form id="applicant-form">

            <div class="form-group">
                <label for="name">Full Name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="address">Address</label>
                <input
                    type="text"
                    id="address"
                    name="address"
                    placeholder="Enter your address"
                    required
                >
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter 10-digit phone number"
                    maxlength="10"
                    required
                >
            </div>

            <div class="form-group">
                <label for="salary">Monthly Salary</label>
                <input
                    type="number"
                    id="salary"
                    name="salary"
                    placeholder="Enter your monthly salary"
                    min="1"
                    required
                >
            </div>

            <div class="form-group">
                <label for="bike-select">Select Bike</label>

                <select id="bike-select" name="bike" required>

                    <option value="" disabled selected>
                        Select your bike
                    </option>

                    <option
                        value="z900"
                        data-company="Kawasaki"
                        data-link="https://www.kawasaki-india.com/en/motorcycles/z/Z900-2026.html"
                    >
                        Kawasaki Z900
                    </option>

                    <option
                        value="zx10r"
                        data-company="Kawasaki"
                        data-link="https://www.kawasaki-india.com/en/motorcycles/ninja/ninja-zx-10r-2026.html"
                    >
                        Kawasaki Ninja ZX-10R
                    </option>

                    <option
                        value="zx6r"
                        data-company="Kawasaki"
                        data-link="https://www.kawasaki-india.com/en/motorcycles/ninja/ninja-zx-6r-2026.html"
                    >
                        Kawasaki Ninja ZX-6R
                    </option>

                    <option
                        value="cbr650r"
                        data-company="Honda"
                        data-link="https://www.bikewale.com/honda-bikes/cbr650r/"
                    >
                        Honda CBR650R
                    </option>

                    <option
                        value="cb650r"
                        data-company="Honda"
                        data-link="https://www.bikewale.com/honda-bikes/cb650r/"
                    >
                        Honda CB650R
                    </option>

                </select>
            </div>

            <p id="form-error"></p>

            <button type="submit">
                Continue
            </button>

        </form>

    </div>

    <script src="bikes_data.js"></script>
    <script src="intro_page.js"></script>

</body>
</html>
