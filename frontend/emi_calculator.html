
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Bike EMI Calculator</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body class="emi-page">

  <div
    class="emi-background"
    id="emi-background"
  ></div>

  <div class="emi-overlay"></div>

  <div class="emi-container">

   <a class="back-link emi-back" href="intro_page.html">
  <h4>CHANGE BIKE</h4>
    </a>
    <br>

    <div class="emi-content">

      <div class="emi-header">
        <div class="brand">BIKE EMI CALCULATOR</div>

        <h1 id="bike-name">
          Bike EMI
        </h1>
        

        <p id="bike-price">
          ₹0
        </p>
      </div>


      <div class="emi-layout">

        <!-- LEFT SIDE -->
        <div class="emi-controls">

          <!-- DOWN PAYMENT -->
          <div class="emi-control">

            <div class="control-header">
              <label for="downpayment">
                Down Payment
              </label>

              <span id="downpayment-value">
                ₹2,20,000
              </span>
            </div>

            <input
              type="range"
              id="downpayment"
              min="0"
              max="50"
              value="20"
              step="1"
            />

            <div class="range-labels">
              <span>0%</span>
              <span>50%</span>
            </div>

          </div>


          <!-- LOAN AMOUNT -->
          <div class="emi-control">

            <div class="control-header">
              <label for="loan-amount">
                Loan Amount
              </label>

              <span id="loan-value">
                ₹8,80,000
              </span>
            </div>

            <input
              type="range"
              id="loan-amount"
              min="0"
              max="100"
              value="80"
              step="1"
            />

            <div class="range-labels">
              <span>50%</span>
              <span>100%</span>
            </div>

          </div>


          <!-- EMI MONTHS -->
          <div class="emi-control">

            <div class="control-header">
              <label for="months">
                EMI Duration
              </label>

              <span id="months-value">
                60 months
              </span>
            </div>

            <input
              type="range"
              id="months"
              min="12"
              max="84"
              value="60"
              step="6"
            />

            <div class="range-labels">
              <span>12 months</span>
              <span>84 months</span>
            </div>

          </div>


          <!-- INTEREST -->
          <div class="emi-control">

            <div class="control-header">
              <label for="interest">
                Interest Rate
              </label>

              <span id="interest-value">
                9.5%
              </span>
            </div>

            <input
              type="range"
              id="interest"
              min="5"
              max="18"
              value="9.5"
              step="0.1"
            />

            <div class="range-labels">
              <span>5%</span>
              <span>18%</span>
            </div>

          </div>

        </div>


        <!-- RIGHT SIDE -->
        <div class="emi-result">

          <p class="result-label">
            Your EMI
          </p>

          <div class="monthly-emi">
            <span id="emi-value">
              ₹18,462
            </span>

            <span id="emi-duration">
              for 60 months
            </span>
          </div>


          <div class="result-divider"></div>


          <div class="result-row">
            <span>Loan Amount</span>
            <strong id="result-loan">
              ₹8,80,000
            </strong>
          </div>


          <div class="result-row">
            <span>Interest Payable</span>
            <strong id="result-interest-rate">
              9.5%
            </strong>
          </div>


          <div class="result-row">
            <span>Total Interest Payable</span>
            <strong id="result-total-interest">
              ₹2,29,000
            </strong>
          </div>


          <div class="result-row total-row">
            <span>Total Amount Payable</span>
            <strong id="result-total">
              ₹11,09,000
            </strong>
          </div>

        </div>

      </div>

    </div>

  </div>

  <script src="emi_calculator.js"></script>

</body>
</html>
